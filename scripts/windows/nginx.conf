# =============================================================================
# CivilPDF-DX nginx for Windows 設定
# nginx フォルダ配置先: C:\nginx\conf\nginx.conf
#
# nginx for Windows: https://nginx.org/en/download.html
# SSL 証明書: win-acme (https://www.win-acme.com/) または
#             内部 CA 証明書 (Intune/Group Policy 配布)
# =============================================================================

worker_processes  auto;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ログフォーマット
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 110m;  # MAX_FILE_SIZE_MB + 10m バッファ

    # Gzip 圧縮
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # セキュリティヘッダ
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- HTTP → HTTPS リダイレクト ---
    server {
        listen       80;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS 本番サーバー ---
    server {
        listen       443 ssl;
        server_name  civilpdf.local;  # 実際のホスト名に変更

        # SSL 証明書 (win-acme または内部 CA)
        ssl_certificate      C:/nginx/ssl/civilpdf.crt;
        ssl_certificate_key  C:/nginx/ssl/civilpdf.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;

        # --- フロントエンド静的ファイル ---
        root   C:/CivilPDF/src/console/frontend/dist;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- バックエンド API プロキシ ---
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # PDF アップロード用バッファ
            proxy_request_buffering on;
            proxy_buffering         off;
        }

        # --- ヘルスチェック ---
        location /health {
            proxy_pass http://127.0.0.1:8000;
        }

        # --- 静的ファイルキャッシュ ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- 開発用 HTTP サーバー (LAN アクセス) ---
    server {
        listen       5181;
        server_name  _;

        location / {
            proxy_pass         http://127.0.0.1:5181;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
