# =============================================================================
# CivilPDF-DX Frontend — nginx server config (production)
# - Serves the Vite SPA build (/usr/share/nginx/html)
# - Reverse-proxies /api/ to the FastAPI backend (compose service "backend")
# - SPA history fallback to index.html
# =============================================================================

upstream civilpdf_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF アップロード上限（backend MAX_FILE_SIZE_MB 既定 100 に合わせる）
    client_max_body_size 100m;

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/wasm image/svg+xml;

    # --- API reverse proxy -> backend (/api/v1/* and /api/*) ---
    location /api/ {
        proxy_pass http://civilpdf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Backend health passthrough (for load balancers / monitoring) ---
    location = /health {
        proxy_pass http://civilpdf_backend/health;
        access_log off;
    }

    # --- Hashed static assets: long cache ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA history fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
