name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements-dev.txt
      - run: pip install ruff==0.8.6
      - run: ruff check src/console/backend/
      - run: ruff format --check src/console/backend/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          PYTHONPATH: src/console/backend
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/console/ -v --tb=short --cov=src/console/backend --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: backend

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies
        # ecdsa PYSEC-2026-1325 は upstream fix 未リリースのため明示 ignore (Issue #106)
        run: pip-audit -r src/console/backend/requirements.txt --ignore-vuln PYSEC-2026-1325

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/console/frontend/playwright-report/
          retention-days: 7

  integration-test:
    name: API Integration Tests (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run integration tests
        env:
          DATABASE_URL: sqlite:///./test_ci_integration.db
          PYTHONPATH: src/console/backend
        run: python -m pytest tests/integration/ -v --tb=short

  # Windows 11 互換性確認ジョブ
  # pathlib.Path 統一化 + database.py SQLite/PostgreSQL 分岐を検証
  backend-test-windows:
    name: Backend Tests (Windows 11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/console/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r src/console/backend/requirements.txt
          pip install -r src/console/backend/requirements-dev.txt
      - name: Run tests on Windows
        env:
          DATABASE_URL: sqlite:///./test_windows.db
          PYTHONPATH: src/console/backend
        run: python -m pytest tests/console/ -v --tb=short -x
        shell: pwsh

  frontend-build-windows:
    name: Frontend Build (Windows 11)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/console/frontend/package-lock.json
      - run: npm ci
        shell: pwsh
      - run: npm run build
        shell: pwsh
